<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Autorisations</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/tables.css}">
    <style>
        .container-custom {
            background-color: white;
            border-radius: 12px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(135, 206, 235, 0.3);
            max-width: 900px;
            width: 95%;
            margin: auto;
        }
        .btn-accept { background-color: #22c55e; color: white; }
        .btn-accept:hover { background-color: #16a34a; color: white; }
        .btn-reject { background-color: #ef4444; color: white; }
        .btn-reject:hover { background-color: #dc2626; color: white; }
    </style>
</head>
<body>

<div style="padding: 30px;">
    <h2 class="text-center">
        <span><i class="bi bi-shield-lock-fill"></i> Autorisations</span>
        <span class="badge bg-primary fs-6" th:text="${demandes.size()} + ' en attente'">0 en attente</span>
    </h2>

    <div th:if="${successMessage}" class="alert alert-success text-center" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger text-center" th:text="${errorMessage}"></div>

    <div>
        <table class="table align-middle">
            <thead>
            <tr>
                <th>Employé</th>
                <th>Détails de l'opération</th>
                <th class="text-center">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="d : ${demandes}">
                <td>
                    <div class="fw-bold text-dark" th:text="${d.utilisateur != null ? d.utilisateur.nom : 'Inconnu'}">Employé</div>
                    <small class="text-muted">
                        <i class="bi bi-clock me-1"></i>
                        <span th:text="${#dates.format(d.dateDemande, 'dd/MM/yyyy HH:mm')}">Date</span>
                    </small>
                </td>
                <td style="width: 40%;">
                        <span class="badge-msg">
                            <i class="bi bi-info-circle me-1"></i>
                            <span th:utext="${#strings.replace(d.message, '|', '&lt;br&gt;')}">Détails</span>
                        </span>
                </td>

                <td class="text-center">
                    <div class="d-inline-flex gap-2">
                        <form th:action="@{/demandes/admin/autorisations/accepter}" method="POST">
                            <input type="hidden" name="idDemande" th:value="${d.id_Demande}">
                            <button type="submit" class="btn btn-accept btn-sm">
                                <i class="bi bi-check-lg"></i> Autoriser
                            </button>
                        </form>

                        <form th:action="@{/demandes/admin/autorisations/refuser}" method="POST">
                            <input type="hidden" name="idDemande" th:value="${d.id_Demande}">
                            <button type="submit" class="btn btn-reject btn-sm">
                                <i class="bi bi-x-lg"></i> Refuser
                            </button>
                        </form>
                    </div>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(demandes)}">
                <td colspan="3">
                    <div class="text-center py-5 text-muted">
                        <i class="bi bi-check2-all" style="font-size: 2rem; color: #22c55e;"></i>
                        <p class="fw-bold mt-2">Tout est traité ! Aucune demande en attente.</p>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
