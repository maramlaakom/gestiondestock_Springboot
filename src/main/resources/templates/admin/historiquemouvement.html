<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Historique des Mouvements</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/notifications.css}">
    <style>
        .text-label {
            font-size: 0.65rem;
            font-weight: 800;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 2px;
        }
        .text-value {
            font-weight: 700;
            color: #1e293b;
            font-size: 1.05rem;
        }
        .badge-msg {
            background-color: #eff6ff;
            color: #3b82f6;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.8rem;
            display: inline-block;
            line-height: 1;
            text-align: center;
            border: 1px solid #dbeafe;
            white-space: nowrap;
        }
    </style>
</head>
<body>

<div style="margin-left:100px; margin-right:100px; margin-top:20px">

    <h2 class="mb-4 text-center">
        <i class="bi bi-journal-text me-2"></i>
        Historique des Mouvements
    </h2>

    <div th:each="mvt : ${mouvements}" class="notif-card" style="flex-direction: column; margin-bottom: 15px;">

        <div class="row align-items-center w-100 m-0">

            <div class="col-md-1 p-0 d-flex justify-content-start">
                <div class="icon-circle"
                     th:classappend="${#strings.toString(mvt.typeMouvement) == 'sortie' ? 'bg-stock' : (#strings.toString(mvt.typeMouvement) == 'transfert' ? 'bg-info' : 'bg-msg')}">
                    <i class="bi"
                       th:classappend="${#strings.toString(mvt.typeMouvement) == 'sortie' ? 'bi-dash-lg' : (#strings.toString(mvt.typeMouvement) == 'transfert' ? 'bi-arrow-left-right' : 'bi-plus-lg')}"></i>
                </div>
            </div>

            <div class="col-md-3">
                <div class="text-label" th:text="${#strings.toUpperCase(mvt.typeMouvement)}">ENTREE</div>
                <div class="text-value" th:text="${mvt.article != null ? mvt.article.nomArticle : 'Article inconnu'}">
                    Nom Article
                </div>
            </div>

            <div class="col-md-3">
                <div class="text-label">user & DATE</div>
                <div class="text-value small" style="color: #64748b;">
                    <i class="bi bi-person me-1"></i>
                    <strong th:text="${mvt.utilisateur.prenom} + ' ' + ${mvt.utilisateur.nom}">Prenom Nom</strong><br>

                    <span class="text-muted fw-normal" style="font-size: 0.75rem;" th:text="${#dates.format(mvt.dateMouvement, 'dd/MM/yyyy HH:mm')}"></span>
                </div>
            </div>

            <div class="col-md-2 text-end p-0">
                <span class="badge-msg" th:text="${mvt.quantite} + ' Unités'">
                    0 Unités
                </span>
            </div>

        </div>

        <div th:if="${mvt.commentaire != null && !mvt.commentaire.isEmpty()}" class="mt-3 p-2 px-3 rounded-2 d-flex align-items-center"
             style="background-color: #f8fafc; border: 1px solid #f1f5f9; border-left: 4px solid #e2e8f0; width: 100%;">
            <i class="bi bi-chat-left-text me-3 text-muted" style="font-size: 0.9rem;"></i>
            <span style="font-size: 0.85rem; color: #64748b; font-style: italic;"
                  th:text="'&ldquo;' + ${mvt.commentaire} + '&rdquo;'">
                "Commentaire"
            </span>
        </div>

    </div>

</div>

</body>
</html>
