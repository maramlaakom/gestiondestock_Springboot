<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin - StockSys</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css}">
  <link rel="stylesheet" th:href="@{/css/base.css}">
  <link rel="stylesheet" th:href="@{/css/cards.css}">
  <style>
    .admin-header {
      background: white; padding: 15px 25px; border-radius: 12px; margin-bottom: 25px;
      border: 2px solid var(--secondary); display: flex; justify-content: space-between;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
    }
    .dashboard-container { padding: 20px; }
    .stat-grid { display: flex; gap: 20px; margin-bottom: 25px; }
    .section-container { background: white; border-radius: 12px; padding: 25px; margin-bottom: 25px; border: 2px solid var(--secondary); }
    .bg-entree { background-color: #f0fff4; color: #22c55e;}
    .bg-sortie { background-color: #fff1f2; color: #ef4444; }
    .bg-transfert { background-color: #eff6ff; color: #3b82f6; }
  </style>
</head>
<body>
<div class="dashboard-container">
  <header class="admin-header">
    <div class="d-flex align-items-center gap-3">
      <div class="avatar-circle"><i class="bi bi-person-fill"></i></div>
      <div>
        <h6 class="mb-0 fw-bold" style="color: #1b254b;" th:text="${nomUser} + ' ' + ${prenomUser}">Nom Admin</h6>
        <small class="text-muted">Admin</small>
      </div>
    </div>
    <div class="d-flex align-items-center gap-4">

      <div class="ps-3" style="border-left: 1px solid var(--secondary);">
        <span class="d-block text-muted small" th:text="${#temporals.format(currentDate, 'dd MMM yyyy')}">Date</span>
        <span class="fw-bold text-primary" th:text="${#dates.format(#dates.createNow(), 'HH:mm')}">Time</span>
      </div>
    </div>
  </header>

  <div class="stat-grid">
    <div class="stat-card">
      <h6 class="text-muted small text-uppercase">Articles</h6>
      <h3 class="fw-bold" th:text="${totalArt}">0</h3>
    </div>
    <div class="stat-card">
      <h6 class="text-muted small text-uppercase">Magasins</h6>
      <h3 class="fw-bold" th:text="${totalMag}">0</h3>
    </div>
    <div class="stat-card">
      <h6 class="text-muted small text-uppercase">Mouvements (Mois)</h6>
      <h3 class="fw-bold" th:text="${totalMvt}">0</h3>
    </div>
    <div class="stat-card">
      <h6 class="text-muted small text-uppercase">Alertes Stock</h6>
      <h3 class="fw-bold" th:text="${nbAlertStock}">0</h3>
    </div>
  </div>

  <div class="section-container">
    <div class="text-danger mb-3">
      <h5><i class="bi bi-exclamation-triangle"></i> Alertes Stock Faible</h5>
    </div>
    <div th:if="${not #lists.isEmpty(alerts)}">
      <div th:each="a : ${alerts}" class="d-flex justify-content-between align-items-center p-2 border-bottom">
        <div>
          <div class="fw-bold" th:text="${a.nomArticle}">Nom Article</div>
          <small class="text-muted" th:text="${a.magasin.nomMagasin}">Nom Magasin</small>
        </div>
        <div>
          <span class="badge bg-light text-danger" th:text="${a.quantite} + ' article'">0 article</span>
        </div>
      </div>
    </div>
    <div th:if="${#lists.isEmpty(alerts)}">
      <p class="text-muted small">Aucune alerte pour le moment.</p>
    </div>
  </div>

  <div class="section-container">
    <div class="text-primary mb-3">
      <h5><i class="bi bi-clock-history"></i> Mouvements Récents</h5>
    </div>
    <div>
      <table class="table table-hover">
        <thead class="table-light">
        <tr>
          <th>Article</th>
          <th>Type</th>
          <th>Quantité</th>
          <th>Date</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="m : ${movements}">
          <td th:text="${m.article.nomArticle}">Article</td>
          <td>
                            <span class="badge"
                                  th:classappend="${m.typeMouvement == 'entree' ? 'bg-entree' : (m.typeMouvement == 'sortie' ? 'bg-sortie' : 'bg-transfert')}"
                                  th:text="${m.typeMouvement}">
                                  Type
                            </span>
          </td>
          <td class="fw-bold" th:text="${m.quantite}">0</td>
          <td class="text-muted small" th:text="${#dates.format(m.dateMouvement, 'dd/MM/yyyy')}">Date</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</body>
</html>
