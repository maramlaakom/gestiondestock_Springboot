<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>StockSys - Panel Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <style>
        body { display: flex; }
        .main-container { flex: 1; height: 100vh; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-header">
        <h2><i class="bi bi-box-seam"></i> StockSys</h2>
    </div>

    <div class="nav-menu">
        <a th:href="@{/admin/dashboard/index}" class="menu-item" target="contentFrame"><i class="bi bi-speedometer2"></i> Tableau de bord</a>
        <a th:href="@{/article/retrieve-all-article}" class="menu-item" target="contentFrame"><i class="bi bi-box-seam"></i> Article</a>
        <a th:href="@{/magasin/retrieve-all-Magasin}" class="menu-item" target="contentFrame"><i class="bi bi-building"></i> Magasins</a>
        <a th:href="@{/mouvement/gestionmouvement}" class="menu-item" target="contentFrame"><i class="bi bi-arrow-left-right"></i> Mouvements</a>
        <a th:href="@{/mouvement/historique}" class="menu-item" target="contentFrame"><i class="bi bi-clock-history"></i> Historique</a>
        <a th:href="@{/demandes/admin/autorisations}" class="menu-item" target="contentFrame">
            <i class="bi bi-clipboard-check"></i> Gestion autorisations
        </a>
        <a th:href="@{/user/retrieve-all-user}" class="menu-item" target="contentFrame"><i class="bi bi-people"></i> Employés</a>
    </div>

    <div class="logout-section">
        <a th:href="@{/logout}" class="btn-logout"><i class="bi bi-box-arrow-right"></i> Déconnexion</a>
    </div>
</div>

<div class="main-container">
    <iframe name="contentFrame" th:src="@{/admin/dashboard/index}"></iframe>
</div>
</body>
</html>
