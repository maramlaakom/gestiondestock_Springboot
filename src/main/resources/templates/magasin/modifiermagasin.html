<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Modifier Magasin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/forms.css}">
</head>
<body class="page-form">
<div class="form-container">
    <h2><i class="bi bi-pencil-square"></i> Modifier le Magasin</h2>

    <form th:action="@{/magasin/updatemagasin}" th:object="${magasin}" method="POST">
        <input type="hidden" th:field="*{idMagasin}">

        <div class="mb-4">
            <label class="form-label">Nom du magasin <span class="required-star">*</span></label>
            <input type="text" th:field="*{nomMagasin}" class="form-control" required>
        </div>

        <div class="mb-4">
            <label class="form-label">Adresse <span class="required-star">*</span></label>
            <input type="text" th:field="*{adresse}" class="form-control" required>
        </div>

        <div class="d-flex gap-3">
            <button type="submit" class="btn btn-primary w-100">Mettre à jour</button>
            <a th:href="@{/magasin/retrieve-all-Magasin}" class="btn btn-secondary w-100 text-center text-decoration-none">
                Annuler
            </a>

        </div>
    </form>
</div>
</body>
</html>
