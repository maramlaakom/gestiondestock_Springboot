<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ajouter Magasin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/forms.css}">
</head>
<body class="page-form">
<div class="form-container">
    <h2>Ajouter un magasin</h2>

    <div th:if="${error}" class="alert alert-danger">
        <p class="m-0" th:text="${error}"></p>
    </div>

    <div th:if="${success}" class="alert alert-success">
        <p class="m-0" th:text="${success}"></p>
    </div>

    <form th:action="@{/magasin/addMagasin}" th:object="${magasin}" method="POST">
        <div class="mb-4">
            <label class="form-label">Nom magasin <span class="required-star">*</span></label>
            <input type="text" th:field="*{nomMagasin}" class="form-control"
                   placeholder="Entrez le nom" required>
            <p class="text-danger small" th:if="${#fields.hasErrors('nomMagasin')}" th:errors="*{nomMagasin}"></p>
        </div>

        <div class="mb-4">
            <label class="form-label">Adresse <span class="required-star">*</span></label>
            <input type="text" th:field="*{adresse}" class="form-control"
                   placeholder="Entrez l'adresse" required>
            <p class="text-danger small" th:if="${#fields.hasErrors('adresse')}" th:errors="*{adresse}"></p>
        </div>

        <div class="d-flex gap-3">
            <button type="submit" class="btn btn-primary w-100">Ajouter</button>
            <a th:href="@{/magasin/retrieve-all-Magasin}" class="btn btn-secondary w-100 text-center text-decoration-none">
                Annuler
            </a>

        </div>
    </form>
</div>
</body>
</html>
