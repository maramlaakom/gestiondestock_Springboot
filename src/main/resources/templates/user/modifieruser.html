<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier Utilisateur</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/forms.css}">
</head>

<body class="page-form">
<div class="form-container">
    <h2><i class="bi bi-pencil-square"></i> Modifier utilisateur</h2>

    <form th:action="@{/user/modifieruser}" th:object="${user}" method="POST">

        <input type="hidden" th:field="*{idUtilisateur}">
        <input type="hidden" th:field="*{motDePasse}">

        <div class="row g-3 mb-4">
            <div class="col-6">
                <label class="form-label">Nom <span class="required-star">*</span></label>
                <input type="text" th:field="*{nom}" class="form-control" required>
            </div>
            <div class="col-6">
                <label class="form-label">Prénom <span class="required-star">*</span></label>
                <input type="text" th:field="*{prenom}" class="form-control" required>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label">Email <span class="required-star">*</span></label>
            <input type="email" th:field="*{email}" class="form-control" required>
        </div>

        <div class="row g-3 mb-5">
            <div class="col-6">
                <label class="form-label">Rôle <span class="required-star">*</span></label>
                <select th:field="*{role}" class="form-select" required>
                    <option value="">-- Choisir role --</option>
                    <option value="admin">Admin</option>
                    <option value="employee">Employe</option>
                </select>
            </div>
            <div class="col-6">
                <label class="form-label">État du compte <span class="required-star">*</span></label>
                <select th:field="*{etatCompte}" class="form-select" required>
                    <option value="">-- Choisir etat de compte --</option>
                    <option value="ACTIF">Actif</option>
                    <option value="BLOQUE">Bloque</option>
                </select>


            </div>
        </div>

        <div class="d-flex gap-3">
            <button type="submit" class="btn btn-primary w-100">Mettre à jour</button>
            <a th:href="@{/user/retrieve-all-user}" class="btn btn-secondary w-100 text-center text-decoration-none">
                Annuler
            </a>
        </div>
    </form>
</div>
</body>
</html>
