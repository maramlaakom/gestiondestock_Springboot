<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Connexion à votre compte</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/forms.css}">
    <style>
        .forgot-password {
            display: block;
            margin-top: 20px;
            color: #3498db;
            text-decoration: none;
            font-size: 14px;
            text-align: center!important;
        }
        .footer-links {
            margin-top: 50px;
            font-size: 14px;
            width: 100%;
        }
        .footer-links a {
            color: #3498db;
            text-decoration: none;
        }
    </style>
</head>
<body class="page-form">
<div class="form-container">
    <h2>Connexion à votre compte</h2>

    <div th:if="${param.error}" class="alert alert-danger text-center">
        Email ou mot de passe incorrect.
    </div>

    <div th:if="${param.logout}" class="alert alert-success text-center">
        Vous avez été déconnecté avec succès.
    </div>

    <form th:action="@{/login}" method="POST">
        <div class="mb-3">
            <label class="form-label">Email :</label>
            <input type="email" name="username" class="form-control" placeholder="Entrez votre adresse email" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Mot de passe :</label>
            <input type="password" name="password" class="form-control" placeholder="Entrez votre mot de passe" required>
        </div>

        <button type="submit" class="btn-primary w-100" style="border:none; padding:10px; border-radius:5px; background-color:#3498db; color:white;">Se connecter</button>
    </form>




</div>
</body>
</html>
