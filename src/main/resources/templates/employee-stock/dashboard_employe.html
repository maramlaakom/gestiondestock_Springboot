<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Employé - StockSys</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/cards.css}">
    <style>
        .dashboard-container { padding: 20px; }
        .employee-header {
            background: white; padding: 15px 25px; border-radius: 12px;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px; border: 2px solid var(--secondary); width: 100%;
            box-sizing: border-box; box-shadow: 0 4px 15px rgba(135, 206, 235, 0.1);
        }
        .stat-grid { gap: 20px; margin-bottom: 25px; display: flex; }
        .stat-card {
            width: 100% !important; margin: 0 !important; display: flex;
            flex-direction: column; justify-content: center; min-height: 120px;
        }
        .content-section { background: white; border-radius: 12px; padding: 25px; margin-bottom: 25px; border: 2px solid var(--secondary); }
        .bg-entree { background-color: #f0fff4; color: #22c55e; }
        .bg-sortie { background-color: #fff1f2; color: #ef4444; }
        .bg-transfert { background-color: #eff6ff; color: #3b82f6; }
    </style>
</head>
<body>
<div class="dashboard-container">
    <header class="employee-header">
        <div class="d-flex align-items-center gap-3">
            <div class="avatar-circle"><i class="bi bi-person-fill"></i></div>
            <div>
                <h6 class="mb-0 fw-bold" style="color: #1b254b;" th:text="${nomUser} + ' ' + ${prenomUser}">Nom Prenom</h6>
                <small class="text-muted">Employé de Stock</small>
            </div>
        </div>

        <div class="d-flex align-items-center gap-4">

            <div class="ps-3" style="border-left: 1px solid var(--secondary);">
                <span class="d-block text-muted small" th:text="${#temporals.format(currentDate, 'dd MMM yyyy')}">Date</span>
                <span class="fw-bold text-primary" th:text="${#calendars.format(#calendars.createNow(), 'HH:mm')}">Time</span>
            </div>
        </div>
    </header>

    <div class="stat-grid">
        <div class="stat-card">
            <h6 class="text-muted small text-uppercase">nb article</h6>
            <h3 class="fw-bold" th:text="${totalArt}">0</h3>
        </div>
        <div class="stat-card">
            <h6 class="text-muted small text-uppercase">nb magasin</h6>
            <h3 class="fw-bold" th:text="${totalMag}">0</h3>
        </div>
        <div class="stat-card">
            <h6 class="text-muted small text-uppercase">mouvement (mois)</h6>
            <h3 class="fw-bold" th:text="${totalMvt}">0</h3>
        </div>
        <div class="stat-card">
            <h6 class="text-muted small text-uppercase">Demandes Envoyées</h6>
            <h3 class="fw-bold" th:text="${totalDemandes}">0</h3>
        </div>
    </div>

    <div class="content-section">
        <div class="text-primary mb-3">
            <h5><i class="bi bi-clock-history"></i> Mouvements Récents</h5>
        </div>
        <div>
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>ARTICLE</th>
                    <th>TYPE</th>
                    <th>QUANTITÉ</th>
                    <th>DATE</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="m : ${movements}">
                    <td class="fw-bold py-3 text-dark" th:text="${m.article != null ? m.article.nomArticle : 'Inconnu'}">Nom Article</td>
                    <td>
                        <span class="badge"
                              th:classappend="${m.typeMouvement == 'entree' ? 'bg-entree' : (m.typeMouvement == 'sortie' ? 'bg-sortie' : 'bg-transfert')}"
                              th:text="${m.typeMouvement}">
                              Type
                        </span>
                    </td>
                    <td class="fw-bold" th:text="${m.quantite}">0</td>
                    <td class="text-muted small" th:text="${#temporals.format(m.dateMouvement, 'dd/MM/yyyy')}">Date</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
