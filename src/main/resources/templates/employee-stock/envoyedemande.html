<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Demande de Permission</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/forms.css}">
</head>
<body>
<div class="page-form">
    <div class="form-container">
        <h2>Nouvelle Demande d'Acces</h2>

        <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/demandes/addDemande}" method="POST">

            <div class="mb-4">
                <label class="form-label">Article Selectionne</label>
                <select name="id_article" class="form-select" required>
                    <option value="">-- Choisir article --</option>
                    <option th:each="a : ${articles}"
                            th:value="${a.idArticle}"
                            th:text="${a.nomArticle} + ' (quantite: ' + ${a.quantite} + ') - ' + ${a.magasin.nomMagasin}">
                    </option>
                </select>
            </div>

            <div class="row">
                <div class="col-md-6 mb-4">
                    <label class="form-label">Type d'Operation</label>
                    <select name="type_action" class="form-select" required>
                        <option value="sortie">Sortie de stock</option>
                        <option value="transfert">entree de stock</option>
                    </select>
                </div>
                <div class="col-md-6 mb-4">
                    <label class="form-label">Quantite</label>
                    <input type="number" name="quantite" class="form-control" min="1" placeholder="0" required>
                </div>
            </div>


            <div class="d-flex gap-3">
                <button type="submit" class="btn btn-primary w-100">Envoyer Demande</button>
                <a th:href="@{/demandes/employe/demandes}" class="btn btn-secondary w-100 text-center text-decoration-none">
                    Retour
                </a>
            </div>

        </form>
    </div>
</div>
</body>
</html>
