<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mouvements - Gestion Stock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/tables.css}">
</head>
<body>
<div style="padding: 30px;">

    <h2 class="text-center">
        <i class="bi bi-card-checklist me-2"></i> État de vos demandes
    </h2>

    <a th:href="@{/mouvement/employe/demandes}" class="bouton text-right">
        <i class="bi bi-arrow-clockwise"></i>
    </a>

    <div>
        <table class="table align-middle">
            <thead>
            <tr>
                <th>Details de l'operation</th>
                <th>Statut</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(demandes)}">
                <td colspan="3" class="text-center py-5">
                    <div class="no-results">
                        <i class="bi bi-inbox d-block mb-2" style="font-size: 2rem;"></i>
                        <p>Aucune demande trouvée.</p>
                    </div>
                </td>
            </tr>

            <tr th:unless="${#lists.isEmpty(demandes)}" th:each="d : ${demandes}">
                <td>
                    <div class="fw-bold mb-1 small text-uppercase" th:text="${d.message}">
                        Message de la demande
                    </div>
                    <div class="small">
                        <i class="bi bi-calendar3 me-1"></i>
                        <span th:text="${#dates.format(d.dateDemande, 'dd/MM/yyyy HH:mm')}">Date</span>
                    </div>
                </td>
                <td>

                    <span th:if="${d.etat.name() == 'en_attente'}" class="badge rounded-pill px-3 py-2" style="background: #a1edf2; color: #000;">En attente</span>
                    <span th:if="${d.etat.name() == 'accepte'}" class="badge rounded-pill px-3 py-2" style="background: #85f197; color: #000;">Accepté</span>
                    <span th:if="${d.etat.name() == 'execute'}" class="badge rounded-pill px-3 py-2" style="background: #d1d1d1; color: #555;">Terminé</span>
                    <span th:if="${d.etat.name() == 'refusee'}" class="badge rounded-pill px-3 py-2" style="background: #ffb0b0; color: #000;">Refusée</span>
                </td>
                <td class="text-center">
                    <div th:if="${d.etat.name() == 'accepte'}">

                        <a th:if="${d.message != null and #strings.containsIgnoreCase(d.message, 'entree')}"
                           th:href="@{/mouvement/entree(id=${d.id_Demande})}"
                           class="btn btn-accept btn-sm px-3">
                            Entrée <i class="bi bi-arrow-right-short"></i>
                        </a>

                        <a th:if="${d.message != null and #strings.containsIgnoreCase(d.message, 'sortie')}"
                           th:href="@{/mouvement/sortie(id=${d.id_Demande})}"
                           class="btn btn-sm px-4" style="background-color: var(--success); color: white;">
                            Sortie <i class="bi bi-box-arrow-up"></i>
                        </a>

                        <a th:if="${d.message == null}"
                           th:href="@{/mouvement/sortie(id=${d.id_Demande})}"
                           class="btn btn-sm px-4" style="background-color: var(--success); color: white;">
                            Exécuter <i class="bi bi-box-arrow-up"></i>
                        </a>

                    </div>

                    <div th:if="${d.etat.name() == 'execute'}">
                        <i class="bi bi-check-circle-fill text-muted fs-5"></i>
                    </div>

                    <div th:if="${d.etat.name() != 'accepte' && d.etat.name() != 'execute'}">
                        <i class="bi bi-lock-fill opacity-50 fs-5"></i>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
