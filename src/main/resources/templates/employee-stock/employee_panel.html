
<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockSys - Espace Employé</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <style>
        body {
            display: flex;
            flex-direction: row;
        }
        .main-container {
            flex: 1;
            height: 100vh;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-header">
        <h2><i class="bi bi-box2-fill"></i> StockSys</h2>
    </div>
    <nav class="nav-menu">
        <a th:href="@{/employee/dashboard/index}"
           class="menu-item"
           target="contentFrame">
            <i class="bi bi-grid"></i> Tableau de bord
        </a>

        <a th:href="@{/magasin/retrieve-all-Magasin}" class="menu-item" target="contentFrame">
            <i class="bi bi-building"></i> Consulter magasin
        </a>

        <a th:href="@{/article/retrieve-all-article}" class="menu-item" target="contentFrame">
            <i class="bi bi-box-seam"></i> Consulter Article
        </a>

        <a th:href="@{/demandes/employe/demandes}" class="menu-item" target="contentFrame">
            <i class="bi bi-card-checklist"></i> Suivi des Demandes
        </a>

        <a th:href="@{/demandes/add}" class="menu-item" target="contentFrame">
            <i class="bi bi-send"></i> Envoyer Demandes
        </a>


    </nav>

    <div class="logout-section">
        <a th:href="@{/logout}" class="btn-logout"><i class="bi bi-box-arrow-right"></i> Déconnexion</a>
    </div>
</div>

<main class="main-container">
    <iframe name="contentFrame"></iframe></main>
</body>
</html>
